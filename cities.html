<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cities | QazTrip</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="qw">
    <div class="head">
      <h1>QazTrip</h1>
      <nav class="ahref">
        <a href="index.html">Home</a>
        <a href="cities.html" class="active">Cities</a>
        <a href="routes.html">Routes</a>
        <a href="tips.html">Tips</a>
        <a href="tour.html">Tour</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="olul">
      <h2>Cities</h2>
      <div class="row g-2 mb-3">
        <div class="col-12 col-md-8">
          <label for="citySearch" class="form-label">Search</label>
          <input type="search" id="citySearch" class="form-control" placeholder="Type a city name">
        </div>
        <div class="col-12 col-md-4">
          <label for="regionFilter" class="form-label">Region</label>
          <select id="regionFilter" class="form-select">
            <option value="all">All regions</option>
            <option value="Center">Center</option>
            <option value="South">South</option>
            <option value="West">West</option>
          </select>
        </div>
      </div>
      <p id="resultsInfo" class="mb-2"></p>
      <div class="row g-3" id="cityList"></div>
    </section>
    <section class="olul">
      <h2>Favorites <span class="badge text-bg-secondary" id="favoritesCount">0</span></h2>
      <ul class="list-group" id="favoritesList"></ul>
    </section>
  </main>
  <footer class="acc text-center">
    <p class="mb-0">&copy; 2026 Temirzakhov Adilzhan &bull;
      <a href="https://github.com/24Dok691">My GitHub</a></p>
  </footer>
  <script src="js/data.js"></script>
  <script src="js/cities.js"></script>
</body>
</html>
