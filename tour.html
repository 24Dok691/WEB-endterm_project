<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tour | QazTrip</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="qw">
    <div class="head">
      <h1>QazTrip</h1>
      <nav class="ahref">
        <a href="index.html">Home</a>
        <a href="cities.html">Cities</a>
        <a href="routes.html">Routes</a>
        <a href="tips.html">Tips</a>
        <a href="tour.html" class="active">Tour</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="olul">
      <h2>Book a Tour</h2>
      <div id="formSuccess" class="alert alert-success" style="display:none"></div>
      <form id="tourForm" action="#" method="post" novalidate>
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" class="form-control">
            <div class="invalid-feedback" id="nameError"></div>
          </div>
          <div class="col-12 col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control">
            <div class="invalid-feedback" id="emailError"></div>
          </div>
          <div class="col-12 col-md-6">
            <label for="tour" class="form-label">Tour</label>
            <select id="tour" class="form-select">
              <option value="">Select a tour</option>
            </select>
            <div class="invalid-feedback" id="tourError"></div>
          </div>
          <div class="col-6 col-md-3">
            <label for="people" class="form-label">People</label>
            <input type="number" id="people" class="form-control" value="1">
            <div class="invalid-feedback" id="peopleError"></div>
          </div>
          <div class="col-6 col-md-3">
            <label for="date" class="form-label">Start date</label>
            <input type="date" id="date" class="form-control">
            <div class="invalid-feedback" id="dateError"></div>
          </div>
          <div class="col-12">
            <span class="form-label d-block">Comfort level</span>
            <input type="radio" name="level" id="eco" checked> <label for="eco">Economy</label>
            <input type="radio" name="level" id="std" class="ms-3"> <label for="std">Standard</label>
            <input type="radio" name="level" id="com" class="ms-3"> <label for="com">Comfort</label>
          </div>
          <div class="col-12">
            <span class="form-label d-block">Extras</span>
            <input type="checkbox" id="guide"> <label for="guide">Guide</label>
            <input type="checkbox" id="hotel" class="ms-3"> <label for="hotel">Hotel</label>
            <input type="checkbox" id="transfer" class="ms-3"> <label for="transfer">Transfer</label>
          </div>
          <div class="col-12">
            <label for="msg" class="form-label">Wishes</label>
            <textarea id="msg" rows="3" class="form-control"></textarea>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-dark">Book</button>
            <button type="reset" class="btn btn-outline-dark">Clear</button>
          </div>
        </div>
      </form>
    </section>
  </main>
  <footer class="acc text-center">
    <p class="mb-0">&copy; 2026 Temirzakhov Adilzhan &bull;
      <a href="https://github.com/24Dok691">My GitHub</a></p>
  </footer>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/tour.js"></script>
</body>
</html>
